<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="brand big"><span>NUNI</span> Repository</div>
    <h1>로그인</h1>
    <p class="muted">파일과 개발 프로젝트를 한 곳에서 관리합니다.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <label>아이디<input name="username" autocomplete="username" required autofocus></label>
    <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary full" type="submit">로그인</button>
  </form>
</body>
</html>
