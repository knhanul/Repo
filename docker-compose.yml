services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nuni_repository
      POSTGRES_USER: nuni_repository
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuni_repository -d nuni_repository"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nuni_repository:${POSTGRES_PASSWORD:-change-me}@db:5432/nuni_repository
    ports:
      - "127.0.0.1:8090:8000"

volumes:
  postgres_data:
